<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="A growing collection of small, weird, fun web apps with no real purpose beyond being delightful.">
  <title>Weird Apps</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%9A%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #fff8ec;
      --ink: #2b2140;
      --muted: #6b5f80;
      --card: #ffffff;
      --accent: #ff6b9a;
      --accent-2: #5bc0eb;
      --accent-3: #ffd23f;
      --leaf: #3bb273;
      --shadow: 4px 4px 0 var(--ink);
      --radius: 18px;
      --font: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 18%, #ffe3ef 0 120px, transparent 121px),
        radial-gradient(circle at 88% 82%, #dff3fb 0 160px, transparent 161px),
        var(--bg);
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.5;
    }

    .page {
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 16px 64px;
    }

    header { text-align: center; margin-bottom: 40px; }

    h1 {
      font-size: clamp(2.4rem, 8vw, 4rem);
      margin: 0;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }

    h1 .wobble {
      display: inline-block;
      color: var(--accent);
      transform: rotate(-4deg);
      animation: wobble 3.2s ease-in-out infinite;
    }

    .tagline {
      margin: 12px auto 0;
      max-width: 34rem;
      color: var(--muted);
      font-size: 1.1rem;
    }

    /* App list */
    .app-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .app-card a {
      display: block;
      height: 100%;
      padding: 20px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      border: 3px solid var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .app-card:nth-child(3n+1) a { --tilt: -1deg; }
    .app-card:nth-child(3n+2) a { --tilt: 0.8deg; }
    .app-card:nth-child(3n) a   { --tilt: -0.4deg; }
    .app-card a { transform: rotate(var(--tilt, 0deg)); }

    .app-card a:hover,
    .app-card a:focus-visible {
      transform: rotate(0deg) translate(-2px, -3px);
      box-shadow: 7px 7px 0 var(--ink);
    }

    .app-card a:focus-visible,
    .reload:focus-visible {
      outline: 3px dashed var(--accent-2);
      outline-offset: 4px;
    }

    .app-id {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--accent-3);
      border: 2px solid var(--ink);
    }

    .app-card h2 { margin: 10px 0 6px; font-size: 1.3rem; }
    .app-card p { margin: 0; color: var(--muted); }

    /* Empty / error states */
    .state {
      text-align: center;
      padding: 32px 20px 40px;
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 560px;
      margin: 0 auto;
    }

    .state h2 { margin: 16px 0 8px; font-size: 1.6rem; }
    .state p { margin: 0 auto 8px; max-width: 28rem; color: var(--muted); }

    .nest {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 6px;
      height: 110px;
      position: relative;
    }

    .egg {
      width: 54px;
      height: 70px;
      border: 3px solid var(--ink);
      border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%;
      background: #fff;
      transform-origin: 50% 90%;
      animation: rattle 2.4s ease-in-out infinite;
      cursor: pointer;
      padding: 0;
      font: inherit;
    }
    .egg:nth-child(1) { background: #ffe3ef; animation-delay: 0.2s; }
    .egg:nth-child(2) { background: #fff3c4; width: 62px; height: 82px; animation-delay: 0.9s; }
    .egg:nth-child(3) { background: #dff3fb; animation-delay: 1.5s; }

    .egg:focus-visible { outline: 3px dashed var(--accent-2); outline-offset: 4px; }
    .egg.poked { animation: poke 0.5s ease-in-out; }

    .state .egg-reply {
      min-height: 1.5em;
      font-weight: 700;
      color: var(--accent);
      margin-top: 12px;
    }

    .count {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.95rem;
      padding: 4px 12px;
      border: 2px dashed var(--muted);
      border-radius: 999px;
      color: var(--muted);
    }

    .reload {
      margin-top: 16px;
      font: inherit;
      font-weight: 700;
      padding: 10px 20px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--accent-3);
      color: var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      cursor: pointer;
    }
    .reload:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

    footer {
      text-align: center;
      margin-top: 56px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes rattle {
      0%, 70%, 100% { transform: rotate(0deg); }
      75% { transform: rotate(-7deg); }
      80% { transform: rotate(6deg); }
      85% { transform: rotate(-4deg); }
      90% { transform: rotate(2deg); }
    }

    @keyframes poke {
      0% { transform: rotate(0) scale(1); }
      30% { transform: rotate(-14deg) scale(1.08); }
      60% { transform: rotate(10deg) scale(0.96); }
      100% { transform: rotate(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Weird <span class="wobble">Apps</span></h1>
      <p class="tagline">Small, strange, mostly useless web apps. Built with love, zero purpose and a suspicious amount of enthusiasm.</p>
    </header>

    <main id="launcher" aria-live="polite">
      <p class="state" id="loading">Counting the weird apps&hellip;</p>
    </main>

    <footer>
      <p>No apps were harmed in the making of this page. Some were merely confused.</p>
    </footer>
  </div>

  <template id="app-card-template">
    <li class="app-card">
      <a>
        <span class="app-id"></span>
        <h2></h2>
        <p></p>
      </a>
    </li>
  </template>

  <template id="empty-template">
    <section class="state" aria-labelledby="empty-title">
      <div class="nest">
        <button type="button" class="egg"><span class="visually-hidden">Poke egg 1</span></button>
        <button type="button" class="egg"><span class="visually-hidden">Poke egg 2</span></button>
        <button type="button" class="egg"><span class="visually-hidden">Poke egg 3</span></button>
      </div>
      <h2 id="empty-title">The weird apps are still hatching</h2>
      <p>Nothing has cracked open yet. They're in there, wobbling, plotting something deeply unnecessary.</p>
      <p class="egg-reply" role="status"></p>
      <span class="count"></span>
    </section>
  </template>

  <template id="error-template">
    <section class="state" aria-labelledby="error-title">
      <div class="nest" aria-hidden="true">
        <span class="egg"></span>
      </div>
      <h2 id="error-title">The app list wandered off</h2>
      <p>We couldn't load the list of apps. It's probably napping somewhere warm.</p>
      <button type="button" class="reload">Go fetch it again</button>
    </section>
  </template>

  <script>
    (function () {
      "use strict";

      const APPS_URL = "apps.json";
      const launcher = document.getElementById("launcher");

      const EGG_REPLIES = [
        "Please do not tap the glass.",
        "Five more minutes.",
        "We are NOT ready.",
        "Rude. I was gestating.",
        "Something in here just said 'bread'.",
        "Shh. A duck is forming.",
        "Hatching is a process, okay?",
        "Come back when we're weirder."
      ];

      function folderFor(app) {
        return app.id + "-" + app.slug + "/";
      }

      function renderApps(apps) {
        const list = document.createElement("ul");
        list.className = "app-list";
        const template = document.getElementById("app-card-template");

        apps.forEach(function (app) {
          const card = template.content.cloneNode(true);
          const link = card.querySelector("a");
          link.href = folderFor(app);
          card.querySelector(".app-id").textContent = "#" + app.id;
          card.querySelector("h2").textContent = app.name;
          card.querySelector("p").textContent = app.idea;
          list.appendChild(card);
        });

        launcher.replaceChildren(list);
      }

      function renderEmpty(totalCount) {
        const state = document.getElementById("empty-template").content.cloneNode(true);
        const reply = state.querySelector(".egg-reply");
        const count = state.querySelector(".count");
        let lastIndex = -1;

        count.textContent = totalCount > 0
          ? totalCount + " ideas currently incubating"
          : "The nest is suspiciously quiet";

        state.querySelectorAll(".egg").forEach(function (egg) {
          egg.addEventListener("click", function () {
            let index;
            do {
              index = Math.floor(Math.random() * EGG_REPLIES.length);
            } while (index === lastIndex && EGG_REPLIES.length > 1);
            lastIndex = index;
            reply.textContent = EGG_REPLIES[index];

            egg.classList.remove("poked");
            void egg.offsetWidth; // restart the animation
            egg.classList.add("poked");
          });
        });

        launcher.replaceChildren(state);
      }

      function renderError() {
        const state = document.getElementById("error-template").content.cloneNode(true);
        state.querySelector(".reload").addEventListener("click", loadApps);
        launcher.replaceChildren(state);
      }

      function loadApps() {
        fetch(APPS_URL, { cache: "no-cache" })
          .then(function (response) {
            if (!response.ok) throw new Error("HTTP " + response.status);
            return response.json();
          })
          .then(function (apps) {
            if (!Array.isArray(apps)) throw new Error("apps.json is not a list");
            const live = apps.filter(function (app) {
              return app && app.status === "live" && app.id && app.slug && app.name;
            });
            if (live.length > 0) {
              renderApps(live);
            } else {
              renderEmpty(apps.length);
            }
          })
          .catch(function (error) {
            console.error("Could not load apps:", error);
            renderError();
          });
      }

      loadApps();
    })();
  </script>
<div id="pr-preview-ribbon" role="note" style="position:fixed;left:12px;bottom:12px;z-index:2147483647; padding:6px 12px;border:2px solid #2b2140;border-radius:999px; background:#ffd23f;color:#2b2140;box-shadow:2px 2px 0 #2b2140; font:700 13px/1.2 system-ui,sans-serif;opacity:.92; pointer-events:none">PREVIEW · PR #8</div>
</body>
</html>
